[project]
name = "fa-ecom"
version = "0.1.0"
description = "FastAPI ecom API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "orjson>=3.11.8",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiomysql>=0.2",
    "pymysql>=1.1",
    "cryptography>=42",
    "fastapi-pagination>=0.15.12",
    "asgi-correlation-id>=4.3.4",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
    "httpx>=0.27",
    "ruff>=0.15.11",
    "pre-commit>=4.6.0",
    "aiosqlite>=0.22.1",
]

[tool.pytest.ini_options]
