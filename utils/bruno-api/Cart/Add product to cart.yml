info:
  name: Add product to cart
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_url}}/my_cart/:product_id/quantity/:quantity"
  headers:
    - name: ""
      value: ""
      disabled: true
  params:
    - name: product_id
      value: "1"
      type: path
    - name: quantity
      value: "1"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
