info:
  name: Get Products By Keyword
  type: http
  seq: 6

http:
  method: GET
  url: "{{api_url}}/public/products/keyword/adj?pageNumber=0&pageSize=10&sortBy=name&sortOrder=desc"
  params:
    - name: pageNumber
      value: "0"
      type: query
    - name: pageSize
      value: "10"
      type: query
    - name: sortBy
      value: name
      type: query
    - name: sortOrder
      value: desc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
