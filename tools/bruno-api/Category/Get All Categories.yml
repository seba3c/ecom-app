info:
  name: Get All Categories
  type: http
  seq: 1

http:
  method: GET
  url: "{{api_url}}/public/categories?pageSize=5&sortBy=name&sortOrder=asc"
  params:
    - name: pageNumber
      value: "0"
      type: query
      disabled: true
    - name: pageSize
      value: "5"
      type: query
    - name: sortBy
      value: name
      type: query
    - name: sortOrder
      value: asc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
