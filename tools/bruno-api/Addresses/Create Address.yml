info:
  name: Create Address
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_url}}/addresses"
  body:
    type: json
    data: |-
      {
        "streetLine1": "Market Street",
        "streetLine2": "Bay Apartments",
        "city": "San Francisco",
        "state": "California",
        "country": "USA",
        "zipCode": "94103"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
