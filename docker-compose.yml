services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fa_ecom
      MYSQL_USER: fa_ecom_user
      MYSQL_PASSWORD: fa_ecom_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    environment:
      - DEBUG=true
      - DATABASE_URL=mysql+aiomysql://fa_ecom_user:fa_ecom_pass@db:3306/fa_ecom
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      - DATABASE_URL=mysql+aiomysql://fa_ecom_user:fa_ecom_pass@db:3306/fa_ecom_test
      - TEST_DATABASE_URL=mysql+aiomysql://fa_ecom_user:fa_ecom_pass@db:3306/fa_ecom_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
